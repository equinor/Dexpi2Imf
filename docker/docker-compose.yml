
services:
  dagalog:
    image: ghcr.io/daghovland/dagalog:0.5.3
    command:
      - --serve
      - --port
      - "3030"
      - --data
      - /home/dagalog/data/rml_mappings/pandid.trig
      - --ontology
      - /home/dagalog/data/owl/dexpi.ttl
      - --ontology
      - /home/dagalog/data/owl/imf-ontology.owl.ttl
      - --ontology
      - /home/dagalog/data/owl/boundary.ttl
      - --rules
      - /home/dagalog/data/datalog/noaka_boundary.datalog
    stdin_open: true
    tty: true
    ports:
      - 3030:3030
    volumes:
      - type: bind
        source: ../
        target: /home/dagalog/data/
        read_only: true
    depends_on:
      rml-mapper:
        condition: service_completed_successfully
  rml-mapper:
    build: rml-mapper
    tty: true
    volumes:
      - type: bind
        source: ../
        target: /app/local/
  backend:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    tty: true
    ports:
      - 8000:8000
    depends_on:
      - dagalog
  frontend:
    image: node:23
    working_dir: /app/local/www
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    ports:
      - 8081:8081
    volumes:
      - type: bind
        source: ../
        target: /app/local/
    command: sh -c "npm install && npm run dev"
  web_old:
    build: web
    tty: true
    ports:
      - 8080:80
    volumes:
      - type: bind
        source: ../www_old
        target: /var/www/html/
    depends_on:
      rml-mapper:
        condition: service_completed_successfully
  symbols:
    build:
      context: ../
      dockerfile: docker/symbol-library/Dockerfile
    ports:
      - 6000:5000